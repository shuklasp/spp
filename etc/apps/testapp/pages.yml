defaults:
  home: home
  pagedir: /src/testapp
specials:
  -
    name: resources
    method: serveResource
pages:
  app:
    url: index.php
    special: 1
  home:
    controller: \App\testapp\Serv\HomeController@index
  about:
    controller: \App\testapp\Serv\HomeController@about
  guide:
    url: pages/guide.php
  dashboard:
    controller: \App\testapp\Serv\DashboardController@index
  login:
    controller: \App\testapp\Serv\AuthController@loginForm
  auth/login:
    controller: \App\testapp\Serv\AuthController@login
  auth/logout:
    controller: \App\testapp\Serv\AuthController@logout
  api/v1/items:
    controller: \App\testapp\Serv\ApiController@index
  'api/v1/items/{id}':
    controller: \App\testapp\Serv\ApiController@show
  contact:
    url: pages/contact.php
  error/404:
    url: pages/errors/404.php
  error/500:
    url: pages/errors/500.php
  assets:
    assets: assets
  theme-assets:
    assets: resources/themes
  comp-assets:
    assets: comp
