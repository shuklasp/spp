services:
  - name: inventory_stats
    runtime: python
    target: inventory
    method: get_stats
    requires_auth: false
    method_http: GET
  - name: diagnostics_health
    script: spp/admin/services/General.php
    method: live_diagnostics_health
  - name: list_audit_logs
    script: spp/admin/services/General.php
    method: live_list_audit_logs
  - name: get_admin_permissions
    script: spp/admin/services/General.php
    method: live_get_admin_permissions
