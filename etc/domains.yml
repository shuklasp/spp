mode: multi
default_app: school1
virtual_host_mode: strict
unmapped_subdomain_policy: block
domain_only_apps: {  }
domains:
  example.com:
    type: primary
    account: default
    default_app: default
    enabled_apps:
      - default
    canonical_host: example.com
    routing_mode: spp_path
  localhost:
    type: primary
    account: default
    default_app: school1
