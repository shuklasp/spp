################################################################################
# Application Isolated Routes
# These routes are discovered by SPPRouter when scanning modules.
# They supplement (not replace) the main etc/apps/ptable/pages.yml
################################################################################

routes:
  - path: "login"
    target: "\\App\\ptable\\Serv\\AuthController@loginForm"
    type: "controller"

  - path: "logout"
    target: "\\App\\ptable\\Serv\\AuthController@logout"
    type: "controller"