defaults:
  home: home
  pagedir: /src/SPPDocs
specials:
  -
    name: resources
    method: serveResource
pages:
  app:
    url: index.php
    special: 1
  install:
    controller: \App\SPPDocs\Controllers\InstallController@wizard
  setup:
    controller: \App\SPPDocs\Controllers\InstallController@wizard
  home:
    controller: \App\SPPDocs\Controllers\DocsController@index
  project:
    controller: \App\SPPDocs\Controllers\DocsController@project
  'project/{projectId}':
    controller: \App\SPPDocs\Controllers\DocsController@project
  'project/{projectId}/discussions':
    controller: \App\SPPDocs\Controllers\DocsController@discussions
  'project/{projectId}/discussions/new':
