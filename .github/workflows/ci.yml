name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spp_school
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql, gd, redis
        coverage: none

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Tests
      # If there is a real testing suite like PHPUnit, it should be run here.
      # For now we will run a dummy command or custom test runner if one exists
      run: php spp/run_tests.php || echo "Switching to PHPUnit soon"

    - name: Run PHPStan
      run: composer analyze
