version: '3.8'

services:
  app:
    build:
      context: ../../
      dockerfile: deploy/myapp/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../../:/var/www/html
    depends_on:
      - db
      - redis

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: spp_myapp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data: