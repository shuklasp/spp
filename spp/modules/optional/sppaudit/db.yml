tables:
    audit_logs:
        id: 'INT AUTO_INCREMENT PRIMARY KEY'
        entity_type: 'VARCHAR(100) NOT NULL'
        entity_id: 'VARCHAR(100) NOT NULL'
        action: 'VARCHAR(20) NOT NULL'
        old_values: TEXT
        new_values: TEXT
        user_id: INT
        ip_address: VARCHAR(45)
        created_at: 'TIMESTAMP DEFAULT CURRENT_TIMESTAMP'
