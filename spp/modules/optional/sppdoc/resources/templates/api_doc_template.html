<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SPP Framework API Documentation</title>
    <style>
        /* Premium Glassmorphism UI */
        body { font-family: "Outfit", "JetBrains Mono", -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 3rem; }
        .container { max-width: 1000px; margin: auto; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 3rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        h1 { color: #f8fafc; font-size: 2.5rem; margin-top: 0; border-bottom: 1px কাঠ solid rgba(255,255,255,0.08); padding-bottom: 1rem; }
        h2 { color: #f43f5e; font-size: 1.5rem; margin-top: 2rem; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 0.5rem; }
        pre { background: rgba(0,0,0,0.3); color: #38bdf8; padding: 1.5rem; border-radius: 12px; overflow-x: auto; font-family: "JetBrains Mono", monospace; border: 1px solid rgba(255,255,255,0.04); box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">OpenAPI 3.0 Specs</div>
        <h1>SPP Framework API Documentation</h1>
        
        <h2>API Routes</h2>
        <pre>{{routes}}</pre>
        
        <h2>Domain Entities</h2>
        <pre>{{entities}}</pre>
    </div>
</body>
</html>
