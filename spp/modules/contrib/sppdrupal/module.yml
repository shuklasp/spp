# SPP Drupal Integration Module

module:
    name: sppdrupal
    version: "1.0"
    pubname: SPP Drupal Bridge
    modgroup: SPP_Optional
    category: 'Core Optional'
    pubdesc: Integrates Drupal (Content & Auth) into SPP.
    includes:
        - class.sppdrupal.php
    services:
        drupal:
            class: \SPPMod\SPPDrupal\SPPDrupal
            shared: true
    config_variables:
        drupal_root: "../drupal" # Path to Drupal root relative to SPP root
        api_url: "" # JSON:API URL for headless mode
    settings:
        drupal_root:
            label: "Drupal Root Path"
            type: "text"
            help: "Path to Drupal root relative to SPP root (e.g., ../drupal). Must contain core/includes/bootstrap.inc."
        api_url:
            label: "JSON:API URL"
            type: "text"
            help: "Full URL to Drupal JSON:API endpoint (e.g., https://site.com/jsonapi) for headless mode."
