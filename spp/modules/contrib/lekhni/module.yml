name: lekhni
version: 1.2.0
description: "Premium Modular Block, Dual-Mode VSCode IDE & Ultimate Enterprise Document Engine"
category: "Core Optional"
author: "SPP Core Team"

settings:
  editor:
    default_mode: "document"      # Workspace mode: "document" or "code"
    code_language: "html"         # Default language tokenizer when launched in code mode
    theme: "dark"
    tab_size: 2
    auto_save_interval: 2000
    enable_ai_copilot: true
    enable_markdown_expansion: true
    media_upload_path: "var/media/lekhni"
    categories:
      - "General"
      - "News"
      - "Tutorial"
      - "Engineering"
      - "Documentation"
