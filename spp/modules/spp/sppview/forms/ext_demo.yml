    type: html
    content: "<h3>Analytics Overview</h3>"

  sales_chart:
    type: chart
    chart_type: line
    data:
      labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"]
      datasets:
        - label: "Revenue"
          data: [12000, 19000, 3000, 5000, 2000, 3000]
          borderColor: "#6366f1"
          backgroundColor: "rgba(99, 102, 241, 0.2)"
          fill: true

  editor_section:
    type: html
    content: "<h3>Content Management</h3><p>Edit your legendary content below.</p>"

  blog_content:
    type: editor
    height: "400px"
    placeholder: "Start typing your masterpiece..."
    value: "<h1>The Future is SPP</h1><p>This content was rendered via <b>drishyam</b>.</p>"
