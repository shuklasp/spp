form:
  name: universe_test
  id: universe_test_form
  method: post
  service: universe_test_service

title: "🚀 SPP Universe Component Sandbox"

elements:
  code_sample:
    type: code
    label: "Monaco Editor (PHP)"
    language: php
    value: "<?php\necho 'Hello SPP Universe!';\n"
    height: "200px"

  location:
    type: map
    label: "Interactive Leaflet Map"
    center: [51.505, -0.09]
    zoom: 13
    markers: 
      - [51.505, -0.09, "Headquarters"]
      - [51.51, -0.1, "Data Center"]
    height: "300px"

  appointment:
    type: calendar
    label: "Flatpickr Booking"
    mode: range
    enable_time: true
    placeholder: "Select date range..."

  tasks:
    type: sortable
    label: "Sortable Task List"
    items:
      - { id: 1, content: "Complete Phase 3 Migrations" }
      - { id: 2, content: "Verify Drishyam Components" }
      - { id: 3, content: "Ship Orion Module System" }

  active_status:
    type: toggle
    label: "Reactive Toggle"
    value: 1

  submit_btn:
    type: input
    inputtype: submit
    value: "Launch Sandbox"
    class: "btn btn-primary btn-glow"
