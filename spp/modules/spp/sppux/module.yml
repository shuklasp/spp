module:
    name: sppux
    version: '1.0'
    pubname: 'SPP UX'
    modgroup: SPP_Core
    pubdesc: 'Native lightweight SPP frontend runtime for reactive application components.'
    category: 'Core Optional'
    includes:
        - class.sppux.php
    deps:
        - sppview
        - sppajax
    services:
        sppux:
            class: \SPPMod\SPPUX\SPPUX
            shared: true
    config_variables:
        runtime_path: 'spp/modules/spp/sppux/js/sppux.js'
        loader_path: 'spp/modules/spp/sppux/js/spp-loader.js'
        component_base: 'src/{app}/comp'
        auto_mount: true
        expose_bridge: true
    settings:
        runtime_path:
            type: text
            label: 'Runtime Script Path'
            help: 'Path to the core SPP-UX JavaScript engine. Change only if using a custom build.'
            default: 'spp/modules/spp/sppux/js/sppux.js'
        loader_path:
            type: text
            label: 'Loader Script Path'
            help: 'Path to the bootstrapper that resolves application dependencies.'
            default: 'spp/modules/spp/sppux/js/spp-loader.js'
        component_base:
            type: text
            label: 'Component Base Path'
            help: 'Base directory where the engine looks for your reactive components. Use {app} as a placeholder.'
            default: 'src/{app}/comp'
        auto_mount:
            type: boolean
            label: 'Auto Mount Components'
            help: 'If enabled, the engine will automatically detect and mount components found in the DOM.'
            default: true
        expose_bridge:
            type: boolean
            label: 'Expose App Service Bridge'
            help: 'Exposes the SPP.Bridge object to components for easy API calls.'
            default: true
