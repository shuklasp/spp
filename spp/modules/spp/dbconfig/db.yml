    - {propname: 'policypayment', propval: 'fromtabs', tabname: 'paytypes', colname: 'payval', pkname: 'paytypeid', pkval: '1'}
    - {propname: 'memvalidity', propval: 'fromtabs', tabname: 'paytypes', colname: 'validity', pkname: 'paytypeid', pkval: '2'}
