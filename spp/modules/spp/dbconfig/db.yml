tables:
  config:
    propname: "VARCHAR(100)"
    PRIMARY KEY: "(propname)"
    propval: "VARCHAR(500) NOT NULL"
    tabname: "VARCHAR(100)"
    colname: "VARCHAR(100)"
    pkname: "VARCHAR(100)"
    pkval: "VARCHAR(100)"
  dropdowns:
    ddid: "VARCHAR(10)"
    optgroupname: "VARCHAR(50)"
    optname: "VARCHAR(50)"
  sequences:
    seqname: "VARCHAR(20)"
    PRIMARY KEY: "(seqname)"
    initval: "BIGINT NOT NULL"
    seqval: "BIGINT NOT NULL"
    incval: "INTEGER NOT NULL"
    lastaccess: "BIGINT NOT NULL"

