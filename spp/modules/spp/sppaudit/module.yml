module:
    name: sppaudit
    pubname: 'SPP Audit Logger'
    version: 1.1.1
    author: 'Antigravity Enterprise Evolution'
    pubdesc: 'Enterprise-grade auditing for entity state changes. Records creation, updates, and deletions with delta tracking.'
    modgroup: Core
    installation:
        tables:
            audit_logs:
                id: 'INT AUTO_INCREMENT PRIMARY KEY'
                entity_type: 'VARCHAR(100) NOT NULL'
                entity_id: 'VARCHAR(100) NOT NULL'
                action: 'VARCHAR(20) NOT NULL'
                old_values: 'TEXT'
                new_values: 'TEXT'
                user_id: 'INT'
                ip_address: 'VARCHAR(45)'
                created_at: 'TIMESTAMP DEFAULT CURRENT_TIMESTAMP'
    settings:
        active:
            type: boolean
            label: 'Enable Audit Logging'
            help: 'When enabled, all entity creation, updates, and deletions will be automatically recorded in the audit trail.'
            default: true
        retention_days:
            type: number
            label: 'Log Retention (Days)'
            help: 'Number of days to preserve audit records. Older entries will be automatically purged to save space.'
            default: 365
