################################################################################
# Application Isolated Routes
# These routes are discovered by SPPRouter when scanning modules.
# They supplement (not replace) the main etc/apps/--help/pages.yml
################################################################################

routes:
  - path: "login"
    target: "\\App\\--help\\Serv\\AuthController@loginForm"
    type: "controller"

  - path: "logout"
    target: "\\App\\--help\\Serv\\AuthController@logout"
    type: "controller"