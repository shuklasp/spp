profile: dev
shared_groups:
    core:
        table_prefix: spp_
        entities:
            - users
            - roles
            - rights
    academic:
        extends: core
        table_prefix: sch_
        entities:
            - Student
            - Teacher
            - Class
    example_shared:
        extends: core
        table_prefix: example_
        entities:
            - User
            - Right
    test_reactivity:
        extends: core
        table_prefix: test_
        entities: {  }
admin_auth:
    username: admin
    password: admin123
apps:
    default:
        base_url: /default
        table_prefix: ''
        shared_group: academic
        etc_path: ''
        src_path: ''
        app_init: ''
    sppadmin:
        base_url: /sppadmin
        table_prefix: sppadmin_
        shared_group: ''
        etc_path: etc/apps/sppadmin
        src_path: src/sppadmin
        app_init: init.php
