profile: dev
shared_groups:
  core:
    table_prefix: spp_
    entities:
      - users
      - roles
      - rights
      - userroles
      - roleright
      - loginrec
      - remember_tokens
      - migrations
      - login_attempts
      - personal_access_tokens
      - oauth_providers
      - sppauth_audit_log
      - magic_links
      - webauthn_credentials
      - oauth_clients
      - oauth_tokens
      - sppgroup
      - sppgroupmember
  academic:
    extends: core
    table_prefix: sch_
    entities:
      - Student
      - Teacher
      - Class
  example_shared:
    extends: core
    table_prefix: example_
    entities:
      - User
      - Right
  test_reactivity:
    extends: core
    table_prefix: test_
    entities: {  }
admin_auth:
  username: admin
  password: admin123
apps:
  default:
    base_url: /default
    table_prefix: ''
    shared_group: academic
    etc_path: ''
    src_path: ''
    app_init: ''
  sppadmin:
    base_url: /sppadmin
    table_prefix: ''
    shared_group: core
    etc_path: etc
    src_path: spp/admin
    app_init: init.php
  sppdev:
    base_url: /sppdev
    table_prefix: ''
    shared_group: core
    etc_path: etc
    src_path: spp/dev
    app_init: init.php
  sppmobile:
    base_url: /sppmobile
    table_prefix: ''
    shared_group: core
    etc_path: src/sppmobile/etc
    src_path: src/sppmobile
    app_init: ''
  ptable:
    base_url: /ptable
    table_prefix: ptable_
    type: mixed
    shared_group: core
    etc_path: etc/apps/ptable
    src_path: src/ptable
    session_handler: redis
    session_save_path: 'tcp://127.0.0.1:6379'
    cache_driver: redis
    cache_host: 127.0.0.1
    cache_port: 6379
  SPPDocs:
    base_url: /sppdocs
    table_prefix: SPPDocs_
    type: mixed
    shared_group: core
    etc_path: src/SPPDocs/etc
    src_path: src/SPPDocs
    app_init: init.php
  store:
    base_url: /store
    table_prefix: store_
    type: blade
    shared_group: core
    etc_path: etc/apps/store
    src_path: src/store
  school1:
    base_url: /school1
    table_prefix: sch_
    type: blade
    shared_group: academic
    etc_path: etc/apps/school1
    src_path: src/school1
base_app: SPPDocs
prototyping:
  auto_evolution: manual
  view_generation: php_html
bridge:
  shared_dir: var/shared
dev:
  testing:
    storage_strategy: same_db
    table_prefix: spptest__
    auto_generate_tests: true
    fuzz_intensity: 10
settings:
  site_name: 'Lekhak Portal'
  debug: true
  compulsory_modules:
    - sppauth
    - sppdb
    - sppconfig
    - sppview
    - drishyam
  ui:
    branding:
      color: '#00ff00'
test_key: test_val
assets:
  admin_js: spp/admin/js
  admin_css: spp/admin/css
sppdocs:
  auth_mode: sppauth
