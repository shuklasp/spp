# SPP Virtual Host Domain Mapping Configuration
# Template configuration for multi-domain routing

mode: single
default_app: default
virtual_host_mode: strict
unmapped_subdomain_policy: block
domain_only_apps: {}
domains:
  example.com:
    type: primary
    account: default
    default_app: default
    enabled_apps:
      - default
    canonical_host: example.com
    routing_mode: spp_path
