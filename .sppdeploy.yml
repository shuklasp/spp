default_environment: production
token: ''
environments:
  production:
    url: 'https://example.com/'
    token: ''
  staging:
    url: 'https://staging.example.com/'
    token: ''
protected:
  - '.env'
  - '.env.*'
  - 'etc/domains.yml'
  - 'etc/domains.local.yml'
  - 'spp/etc/domains.yml'
  - 'spp/etc/domains.local.yml'
  - 'etc/apps/**'
  - 'domains/**'
  - 'data/**'
  - 'sppdata/**'
  - 'storage/**'
  - 'uploads/**'
  - 'var/**'
exclude:
  - '.git/**'
  - 'var/**'
  - 'spp/var/**'
  - 'tests/**'
  - 'scratch/**'
  - 'brain/**'
  - '*.log'
  - '*.sqlite'
  - '*.sqlite3'
  - '*.db'
  - 'data/**'
  - 'sppdata/**'
  - 'storage/**'
  - 'uploads/**'

