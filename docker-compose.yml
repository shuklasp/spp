version: '3.8'

services:
  sppdocs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sppdocs_app
    restart: unless-stopped
    ports:
      - "${SPP_PORT:-8080}:80"
    environment:
      - SPP_PROFILE=${SPP_PROFILE:-lekhak}
      - SPP_SEED=${SPP_SEED:-true}
      - SPP_APP=${SPP_APP:-SPPDocs}
    volumes:
      - spp_data:/var/www/html/data
      - spp_etc:/var/www/html/etc
      - spp_var:/var/www/html/var
    healthcheck:
      test: ["CMD", "php", "spp.php", "sys:audit"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  spp_data:
    driver: local
  spp_etc:
    driver: local
  spp_var:
    driver: local
