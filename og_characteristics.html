<p>Other than nuclear properties, no properties of <a href="/school1/ptable/element/Og" class="wiki-link" title="Oganesson (Og)">oganesson</a> or its compounds have been measured; this is due to its extremely limited and expensive production and the fact that it decays very quickly. Thus only predictions are available.
